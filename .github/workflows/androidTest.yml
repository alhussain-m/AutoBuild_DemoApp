name: Android Mobile Build
run-name: Android Build - ${{ github.event.inputs.brand }} - ${{ github.event.inputs.environment }} @ ${{ github.event.inputs.branch }}

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch name of mobile repo to build'
        required: true
        type: string
        default: 'qa6'
      brand:
        description: 'Brand/App to build'
        required: true
        type: choice
        options:
          - ameripharma
          - avevorx
          - ca
          - citushealth
          - intermountain
          - kabafusion
          - kennebecpharmacy
          - matrixcare
          - medrx
          - myInhouseconnect
          - myanovo
          - nutrishare
          - orsinipharmacy
          - premierinfusion
          - realocares
          - rxconnect
          - soleoconnect
          - trustport
          - virtisconnect
          - vitalcare
        default: 'citushealth'
      environment:
        description: 'Environment (e.g., qa6, qa7, production, stage, ca, kabafusion)'
        required: true
        type: string
        default: 'qa6'

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      BUILD_ENV: ${{ github.event.inputs.environment }}
      VERSION_SUFFIX: "-beta.${{ github.run_number }}"
      BRAND: ${{ github.event.inputs.brand }}

    steps:
      - name: Checkout Mobile Repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          scope: '@resmed'
          registry-url: 'https://npm.pkg.github.com'

      - name: Install dependencies
        run: npm install --force
        env:
          NODE_AUTH_TOKEN: ${{ secrets.CITUS_NPM_AUTH_TOKEN }}

      - name: Install Ionic CLI
        run: npm install -g @ionic/cli

      - name: Copy custom-configs.ts
        run: cp src/config/custom-configs.example.ts src/config/custom-configs.ts

    
      - name: Build Android APK
        run: |
          npm run build -- --configuration=${{ github.event.inputs.environment }}
          npx cap sync android
          cd android
          ./gradlew assembleDebug

      - name: Generate APK name
        id: vars
        run: |
          COMMIT_HASH=$(echo $GITHUB_SHA | cut -c1-7)
          DATE=$(date +'%m%d_%H%M')
          APK_NAME="${{ github.event.inputs.brand }}-${{ github.event.inputs.environment }}_${DATE}_${COMMIT_HASH}"
          echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT

      - name: Rename APK and prepare artifact folder
        run: |
          cd android/app/build/outputs/apk/debug
          mkdir "${{ steps.vars.outputs.apk_name }}"
          mv app-debug.apk "${{ steps.vars.outputs.apk_name }}/${{ steps.vars.outputs.apk_name }}.apk"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vars.outputs.apk_name }}
          path: android/app/build/outputs/apk/debug/${{ steps.vars.outputs.apk_name }}
